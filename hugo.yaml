title: ergohaven docs

cleanDestinationDir: true

module:
  imports:
    - path: github.com/imfing/hextra

defaultContentLanguage: ru

languages:
  ru:
    baseURL: "https://docs.eh.works/"
    languageCode: ru-RU
    languageName: Русский
    weight: 1
    params:
      brandURL: "https://docs.eh.works/"
    menus:
      main:
        - identifier: docs
          name: Документация
          pageRef: /
          weight: 1
        
        - identifier: roadmap
          name: Roadmap
          pageRef: /roadmap
          weight: 2
        - identifier: faq
          name: FAQ
          pageRef: /faq
          weight: 3

        - identifier: shop
          name: Магазин
          weight: 4
          url: "https://eh.works/shop"

        - name: Search
          weight: 5
          params:
            type: search
        - name: Language
          weight: 6
          params:
            type: language-switch
            label: true     # опционально
            icon: "translate"  # опционально, иначе будет дефолтная иконка
        - name: Theme
          weight: 7
          params:
              type: theme-toggle
              label: true   # опционально, по умолчанию false
  en:
    baseURL: "https://docs.eh.industries/"
    languageCode: en-US
    languageName: English
    weight: 2
    params:
      brandURL: "https://docs.eh.industries/"
    menus:
      main:
        - identifier: docs
          name: Documentation
          pageRef: /
          weight: 1

        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 2

        - identifier: roadmap
          name: Roadmap
          pageRef: /roadmap
          weight: 3
        - identifier: faq
          name: FAQ
          pageRef: /faq
          weight: 4

        - identifier: shop
          name: Shop
          weight: 5
          url: "https://eh.industries/shop"

        - name: Search
          weight: 6
          params:
            type: search
        - name: Language
          weight: 7
          params:
            type: language-switch
            label: true     # опционально
            icon: "translate"  # опционально, иначе будет дефолтная иконка
        - name: Theme
          weight: 8
          params:
              type: theme-toggle
              label: true   # опционально, по умолчанию false

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/eh-full.svg
      dark: images/eh-full-white.svg
      link: /
      width: 150
      height: auto

  footer:
    displayCopyright: false
    displayPoweredBy: false
    custom: true
    width: full

  editURL:
    enable: true
    base: "https://github.com/ergohaven/docs/edit/main/content"
