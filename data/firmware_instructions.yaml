      - "Connect the device via USB-C, quickly double-press <code>Reset</code>, and copy the ZMK reset file to the drive that opens"
      - "After the device restarts, double-press <code>Reset</code> again and copy the device firmware file"

service_rmk:
  ru:
    title: Как использовать прошивку сброса
    steps:
      - "Подключите устройство или половинку клавиатуры по USB-C и дважды быстро нажмите <code>Reset</code>"
      - "Скопируйте файл сброса RMK на открывшийся диск"
      - "После перезагрузки установите обычную прошивку для вашей модели; для сплит-клавиатуры повторите действия на обеих половинках"
  en:
    title: How to use the reset firmware
    steps:
      - "Connect the device or keyboard half via USB-C and quickly double-press <code>Reset</code>"
      - "Copy the RMK reset file to the drive that opens"
      - "After the device restarts, install the regular firmware for your model; repeat the steps on both halves of a split keyboard"

