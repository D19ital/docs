zmk_split:
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте все показанные файлы для левой и правой половинок"
      - "Подключите левую половинку по USB-C, дважды быстро нажмите <code>Reset</code> и скопируйте на появившийся диск файл <code>left</code>"
      - "Повторите действия для правой половинки, используя файл <code>right</code>"
      - "После обновления одновременно нажмите <code>Reset</code> на обеих половинках, чтобы восстановить их соединение"
  en:
    title: How to update the firmware
    steps:
      - "Download all displayed files for the left and right halves"
      - "Connect the left half via USB-C, quickly double-press <code>Reset</code>, and copy the <code>left</code> file to the drive that appears"
      - "Repeat these steps for the right half using the <code>right</code> file"
      - "After the update, press <code>Reset</code> on both halves simultaneously to reconnect them"

zmk_qube:
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте все показанные файлы"
      - "По очереди подключите устройства, дважды быстро нажмите <code>Reset</code> на каждом и установите прошивки в порядке: Qube, левая половинка, правая половинка"
      - "Используйте только соответствующие файлы <code>qube</code>, <code>left_qube</code> и <code>right</code>"
  en:
    title: How to update the firmware
    steps:
      - "Download all displayed files"
      - "Connect each device in turn, quickly double-press <code>Reset</code> on each one, and install the firmware in this order: Qube, left half, right half"
      - "Use only the matching <code>qube</code>, <code>left_qube</code>, and <code>right</code> files"

zmk_single:
  ru:
    title: Как обновить прошивку
    steps:
      - "Подключите устройство по USB-C и дважды быстро нажмите <code>Reset</code> на нижней части корпуса"
      - "Скопируйте скачанный UF2-файл на появившийся диск — после копирования устройство перезагрузится"
  en:
