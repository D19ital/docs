k03_zmk:
  source: /device/archive/k03-we/#прошивка
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте <code>settings_reset</code> и файлы K:03 v4 для левой и правой половинок"
      - "Подключите левую половинку по USB-C, дважды нажмите <code>Reset</code> и скопируйте <code>settings_reset</code> на открывшийся диск"
      - "Повторите сброс для правой половинки"
      - "Снова дважды нажмите <code>Reset</code> на левой половинке и скопируйте файл K:03 v4 для левой стороны"
      - "Повторите действия для правой половинки, используя файл K:03 v4 для правой стороны"
      - "Если при копировании появляется сообщение об ошибке, его можно игнорировать"
  en:
    title: How to update the firmware
    steps:
      - "Download <code>settings_reset</code> and the K:03 v4 files for the left and right halves"
      - "Connect the left half via USB-C, double-press <code>Reset</code>, and copy <code>settings_reset</code> to the drive that opens"
      - "Repeat the reset for the right half"
      - "Double-press <code>Reset</code> on the left half again and copy the K:03 v4 file for the left side"
      - "Repeat these steps for the right half using the K:03 v4 file for the right side"
      - "If a copy error appears, it can be ignored"

imperial44_zmk:
  source: /device/archive/imperial44-we/#обновление-прошивки
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте <code>settings_reset</code> и файлы Imperial44 для левой и правой половинок, затем выключите обе половинки"
      - "Подключите левую половинку по USB-C, дважды нажмите <code>Reset</code> и скопируйте <code>settings_reset</code> на открывшийся диск"
      - "Снова дважды нажмите <code>Reset</code> и скопируйте файл Imperial44 для левой стороны"
      - "Повторите эти действия для правой половинки, используя файл для правой стороны"
      - "Включите обе половинки и одновременно нажмите и отпустите <code>Reset</code> на них, чтобы синхронизировать клавиатуру"
  en:
    title: How to update the firmware
    steps:
      - "Download <code>settings_reset</code> and the Imperial44 files for the left and right halves, then turn off both halves"
      - "Connect the left half via USB-C, double-press <code>Reset</code>, and copy <code>settings_reset</code> to the drive that opens"
      - "Double-press <code>Reset</code> again and copy the Imperial44 file for the left side"
      - "Repeat these steps for the right half using the file for the right side"
      - "Turn on both halves and press and release <code>Reset</code> on them simultaneously to synchronize the keyboard"

qube_zmk:
  source: /device/archive/qube/
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте <code>settings_reset</code> и три файла основной прошивки: для Qube, левой и правой половинок"
      - "Выключите обе половинки клавиатуры"
      - "По очереди подключите Qube, левую и правую половинки, дважды нажмите <code>Reset</code> на каждом устройстве и скопируйте <code>settings_reset</code>"
      - "Снова переведите Qube в режим загрузчика и скопируйте файл прошивки Qube"
      - "Прошейте левую половинку файлом <code>left_qube</code>, затем правую половинку файлом <code>right</code>"
      - "Для Velvet UI используйте <code>ui_left</code> для левой половинки и <code>ui_right_qube</code> для правой"
      - "Подключите Qube к компьютеру, включите сначала левую, затем правую половинку и дождитесь их синхронизации"
  en:
    title: How to update the firmware
    steps:
      - "Download <code>settings_reset</code> and the three main firmware files: Qube, left half, and right half"
      - "Turn off both keyboard halves"
      - "Connect Qube, the left half, and the right half one at a time, double-press <code>Reset</code> on each device, and copy <code>settings_reset</code>"
      - "Put Qube into bootloader mode again and copy the Qube firmware file"
      - "Flash the left half with the <code>left_qube</code> file, then flash the right half with the <code>right</code> file"
      - "For Velvet UI, use <code>ui_left</code> for the left half and <code>ui_right_qube</code> for the right half"
      - "Connect Qube to the computer, turn on the left half first, then the right half, and wait for synchronization"

