k04:
  source: /device/k04/#перепрошивкаобновление-встроенного-по
  ru:
    title: Как обновить прошивку
    steps:
      - "Скачайте прошивку «RMK — сброс всех настроек» и файлы K:04 для левой и правой половинок"
      - "Подключите левую половинку по USB-C и дважды нажмите <code>Reset</code> на обратной стороне — откроется диск загрузчика"
      - "Скопируйте на диск прошивку сброса RMK и повторите эти действия для правой половинки"
      - "Снова дважды нажмите <code>Reset</code> на левой половинке и скопируйте файл K:04 для левой стороны"
      - "Повторите действия для правой половинки, используя файл K:04 для правой стороны"
      - "Если при копировании появляется сообщение об ошибке, его можно игнорировать — половинка перезагружается сразу после записи файла"
  en:
    title: How to update the firmware
    steps:
      - "Download the “RMK — reset all settings” firmware and the K:04 files for the left and right halves"
      - "Connect the left half via USB-C and double-press <code>Reset</code> on the back — the bootloader drive will open"
      - "Copy the RMK reset firmware to the drive and repeat these steps for the right half"
      - "Double-press <code>Reset</code> on the left half again and copy the K:04 file for the left side"
      - "Repeat these steps for the right half using the K:04 file for the right side"
      - "If a copy error appears, it can be ignored — the half restarts immediately after the file is written"

phenom:
  source: /device/phenom/#перепрошивкаобновление-встроенного-по
  ru:
    title: Как обновить прошивку
    steps:
      - "Сохраните текущую раскладку в Entropy через «Раскладка» → «Экспорт раскладки»"
      - "Переведите клавиатуру в режим загрузчика: дважды нажмите <code>Reset</code> снизу или зажмите <code>BOOT</code> и подключите USB-C"
      - "Дождитесь появления диска загрузчика и скопируйте на него скачанный UF2-файл"
      - "После перезагрузки импортируйте сохранённую раскладку через «Раскладка» → «Импорт раскладки»"
  en:
    title: How to update the firmware
    steps:
      - "Save the current layout in Entropy using “Layout” → “Export layout”"
      - "Enter bootloader mode: double-press <code>Reset</code> on the bottom or hold <code>BOOT</code> while connecting USB-C"
      - "Wait for the bootloader drive to open and copy the downloaded UF2 file to it"
      - "After the keyboard restarts, import the saved layout using “Layout” → “Import layout”"

macropad:
  source: /device/macropad/#обновление-прошивки
  ru:
    title: Как обновить прошивку
    steps:
      - "Убедитесь, что версия прошивки соответствует версии M4CR0Pad"
      - "Сохраните текущую раскладку в Vial через «File» → «Save current layout»"
      - "Переведите макропад в режим загрузчика одним из способов: удерживайте верхнюю левую клавишу при подключении USB-C, дважды нажмите <code>Reset</code> или удерживайте <code>BOOT</code> при подключении"
      - "Дождитесь появления диска загрузчика и скопируйте на него скачанный UF2-файл"
      - "После перезагрузки загрузите сохранённую раскладку через «File» → «Load saved layout»"
  en:
    title: How to update the firmware
    steps:
      - "Make sure the firmware version matches the M4CR0Pad version"
      - "Save the current layout in Vial using “File” → “Save current layout”"
      - "Enter bootloader mode in one of these ways: hold the top-left key while connecting USB-C, double-press <code>Reset</code>, or hold <code>BOOT</code> while connecting"
      - "Wait for the bootloader drive to open and copy the downloaded UF2 file to it"
      - "After the macropad restarts, load the saved layout using “File” → “Load saved layout”"

